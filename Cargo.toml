[package]
name = "varvedb"
version = "0.3.0"
edition = "2021"
autobenches = false
license = "MPL-2.0"
authors = ["Matheus Cardoso <varvedb@matheus.sbs>"]
description = "A high-performance, embedded, append-only event store for Rust."
repository = "https://github.com/Cardosaum/varvedb"
documentation = "https://docs.rs/varvedb"
homepage = "https://github.com/Cardosaum/varvedb"
keywords = ["event-store", "database", "embedded", "event-sourcing", "lmdb"]
categories = ["database-implementations", "data-structures"]
rust-version = "1.81.0"
exclude = [
    ".github",
    ".gitignore",
    "deny.toml",
    "scripts",
    "book",
    "images",
    "tests",
    "benches",
    "fuzz",
    "issues",
]

[features]
default = []
log = ["tracing", "tracing-subscriber"]
log_trace = ["log"]
log_debug = ["log"]
log_info = ["log"]
log_warn = ["log"]
log_error = ["log"]
debug_eprintln = []
serde = ["dep:serde"]

[dependencies]
heed = "0.22.0"
ouroboros = "0.18.5"
rkyv = "0.8.12"
serde = { version = "1.0", features = ["derive"], optional = true }
thiserror = "2.0.17"
tracing = { version = "0.1", features = [
    "log",
    "release_max_level_info",
], optional = true }
tracing-subscriber = { version = "0.3.22", features = [
    "env-filter",
], optional = true }

[dev-dependencies]
tempfile = "3.10.0"
criterion = "0.5.1"
proptest = "1.4.0"
bytecheck = "0.8.2"
rstest = "0.26.1"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[[bench]]
name = "varvedb_benchmarks"
harness = false
path = "benches/main.rs"
